# nginx 설정. 서버의 /etc/nginx/sites-available/oss 로 복사해서 쓴다 (docs/deploy.md).
# 들어온 요청을 Docker 컨테이너(127.0.0.1:3000)로 넘긴다.
#
# https 부분(443, 인증서 경로, http를 https로 넘기는 설정)은 여기에 없다.
# 서버에서 certbot을 실행하면 certbot이 복사된 파일에 직접 추가한다.

server {
    listen 80;
    server_name daesik.duckdns.org kwfood.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:3000;

        # nginx를 거치면 앱에는 모든 요청이 nginx에서 온 것처럼 보인다.
        # 원래 주소, 사용자 IP, http인지 https인지를 헤더에 담아 넘긴다
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
