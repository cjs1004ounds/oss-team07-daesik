<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>광운대 주변 음식점 추천 지도</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/map.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="/">광운대 주변 음식점 추천 지도</a>
    <a class="button" href="/search.html">기록 남기기</a>
  </header>

  <main class="map-layout">
    <!-- 옆 칸. 기록이 있는 가게 목록과 가게 상세가 들어올 자리 -->
    <section class="side-panel">
      <h2>기록이 있는 가게</h2>
      <p class="sub">아직 만드는 중입니다. 가게를 검색해서 한 줄 추천을 남길 수 있습니다.</p>
      <p class="sub">서버 상태: <span id="server-status">확인 중</span></p>
    </section>

    <!-- 지도가 들어올 자리 -->
    <div id="map">
      <p id="map-message" class="sub">지도가 들어올 자리입니다.</p>
    </div>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
