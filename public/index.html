<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대식이 - 광운대 주변 음식점 추천 지도</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/map.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="/">대식이</a>
    <a class="button" href="/search.html">기록 남기기</a>
  </header>

  <main class="map-layout">
    <!-- 옆 칸. 기록이 있는 가게 목록과 가게 상세가 들어올 자리 -->
    <section class="side-panel">
      <h2>기록이 있는 가게</h2>
      <p class="sub">아직 만드는 중입니다. 가게를 검색해서 한 줄 추천을 남길 수 있습니다.</p>
    </section>

    <!-- 카카오맵이 그려지는 자리. 뜨기 전이나 못 띄웠을 때는 안내 글자가 보인다 (js/map.js) -->
    <div id="map">
      <p id="map-message" class="sub"></p>
    </div>
  </main>

  <script src="/js/map.js"></script>
</body>
</html>
