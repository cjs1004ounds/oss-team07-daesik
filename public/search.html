<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가게 검색 | 대식이</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/search.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="/">대식이</a>
  </header>

  <main class="page">
    <p class="sub"><a href="/">지도로 돌아가기</a></p>

    <h1>가게 검색</h1>
    <p>한 줄 추천을 남길 가게를 찾아 주세요. 학교 근처 음식점과 카페가 나옵니다.</p>

    <!-- 교내 인증. 학교 안에서 한 번 누르면 30일 동안 유지된다 (js/verify.js) -->
    <section id="verify-box" class="verify-box">
      <p id="verify-status" class="verify-status" role="status">교내 인증 상태를 확인하는 중입니다.</p>
      <button id="verify-button" type="button" hidden>교내 인증하기</button>
      <p class="sub verify-note">학교 와이파이에 연결돼 있으면 바로 되고, 아니면 위치를 한 번 물어봅니다. 위치와 접속 IP는 학교 안인지 판정하는 데만 쓰고 저장하지 않습니다.</p>
    </section>

    <form id="search-form">
      <label for="search-input">가게 이름이나 메뉴</label>
      <div class="search-row">
        <input id="search-input" type="search" placeholder="예: 제육, 돈까스" autocomplete="off" required>
        <button id="search-button" type="submit">검색</button>
      </div>
    </form>

    <!-- 요즘 많이 먹는 메뉴. 누르면 그 메뉴로 검색한다 (GET /api/trends). 기록이 없으면 숨긴다 -->
    <section id="trends" class="trends" hidden>
      <h2>요즘 많이 먹는 메뉴</h2>
      <div id="trend-list" class="trend-list"></div>
    </section>

    <!-- 검색 중, 결과 없음, 오류 같은 안내가 들어가는 자리 -->
    <p id="search-message" role="status"></p>

    <!-- 검색 결과. 가게 하나가 버튼 하나 -->
    <ul id="search-results"></ul>
  </main>

  <script src="/js/verify.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
