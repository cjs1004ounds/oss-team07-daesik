<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한 줄 추천 쓰기 | 광운대 주변 음식점 추천 지도</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!--
    한 줄 추천 작성 화면이 들어올 자리 (이슈 #11).
    검색 화면에서 고른 가게가 넘어오는지 확인하려고 가게 이름만 보여 준다.
    작성 화면을 만들 때 main 안쪽을 통째로 바꿔도 된다.
    맨 위 바(header)와 main의 class="page"는 다른 화면과 모양을 맞추려고 넣은 것이다.
  -->
  <header class="site-header">
    <a class="site-title" href="/">광운대 주변 음식점 추천 지도</a>
  </header>

  <main class="page">
    <p class="sub"><a href="/search.html">다른 가게 찾기</a></p>

    <h1>한 줄 추천 쓰기</h1>
    <p>고른 가게: <strong id="place-name"></strong></p>
    <p>작성 화면은 아직 만드는 중입니다.</p>
  </main>

  <script>
    // 검색 화면이 sessionStorage에 넣어 둔 가게를 꺼낸다 (docs/api.md)
    const saved = sessionStorage.getItem('selectedPlace');
    if (saved === null) {
      // 가게를 고르지 않고 들어왔으면 검색 화면으로 돌려보낸다
      location.replace('/search.html');
    } else {
      const place = JSON.parse(saved);
      document.getElementById('place-name').textContent = place.name;
    }
  </script>
</body>
</html>
