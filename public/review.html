<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한 줄 추천 쓰기 | 대식이</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/review.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="/">대식이</a>
  </header>

  <main class="page">
    <p class="sub"><a href="/search.html">다른 가게 찾기</a></p>

    <h1>한 줄 추천 쓰기</h1>

    <section class="selected-place" aria-label="고른 가게">
      <strong id="place-name" class="selected-place-name"></strong>
      <span id="place-category" class="sub"></span>
    </section>

    <form id="review-form" novalidate>
      <div class="field">
        <div class="label-row">
          <label for="review-text">한 줄 추천</label>
          <span id="text-count" class="sub">0 / 100자</span>
        </div>
        <textarea
          id="review-text"
          rows="3"
          maxlength="100"
          placeholder="예: 제육 7천원인데 양 많음 혼밥하기 좋음"
          required
        ></textarea>
        <p class="privacy-notice">이름, 학번, 연락처 같은 개인정보는 쓰지 말아 주세요. 남긴 추천은 누구나 볼 수 있습니다.</p>
      </div>

      <div class="field">
        <label for="review-price">1인 가격 (원, 선택)</label>
        <!-- 쉼표를 붙여 보여 주려고 type="number" 대신 글자 입력 칸을 쓴다. 휴대폰에서는 숫자 자판이 뜬다 -->
        <div class="price-row">
          <input
            id="review-price"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            maxlength="7"
            placeholder="비워 두거나 1,000~100,000 사이 숫자"
          >
          <button id="price-down" type="button" class="step-button" aria-label="100원 내리기">-100</button>
          <button id="price-up" type="button" class="step-button" aria-label="100원 올리기">+100</button>
        </div>
      </div>

      <div class="field">
        <span class="field-label">태그 (최대 3개, 선택)</span>
        <div id="tag-list" class="tag-list" role="group" aria-label="추천 태그 선택"></div>
      </div>

      <p id="form-message" class="form-message" role="status"></p>

      <div class="actions">
        <button id="submit-button" type="submit">저장하기</button>
      </div>
    </form>
  </main>

  <script src="/js/review.js"></script>
</body>
</html>
